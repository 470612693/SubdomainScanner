name: Build and Release SubdomainScanner

on:
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的标签时触发（如 v1.0.0）
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: SubdomainScanner.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 不要用 actions/setup-dotnet 去安装 .NET Framework（会导致 404）。
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Show dotnet and msbuild info (for debugging)
      run: |
        echo "===== dotnet --info ====="
        dotnet --info || echo "dotnet not present or SDK not applicable"
        echo "===== msbuild -version ====="
        msbuild -version

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=${{ github.event.inputs.build_configuration || matrix.configuration }}
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Decode the pfx
      if: ${{ secrets.Base64_Encoded_Pfx != '' }}
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Create the app package
      run: msbuild $env:Wap_Project_Path /p:Configuration=${{ github.event.inputs.build_configuration || matrix.configuration }} /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx
      env:
        Appx_Bundle: Always
        Appx_Bundle_Platforms: x86|x64
        Appx_Package_Build_Mode: StoreUpload
        Configuration: ${{ matrix.configuration }}

    - name: Remove the pfx
      if: ${{ secrets.Base64_Encoded_Pfx != '' }}
      run: Remove-Item -path $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package
        path: ${{ env:Wap_Project_Directory }}\AppPackages
